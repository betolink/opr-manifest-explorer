[project]
name = "xopr-manifest-explorer"
version = "0.1.0"
description = "Interactive visualization of XOPR (Open Polar Radar) chunk manifests"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "virtualizarr[hdf]",
    "vzviz @ git+https://github.com/virtual-zarr/vzviz",
    "obspec-utils @ git+https://github.com/developmentseed/obspec-utils",
    "panel>=1.0",
    "holoviews>=1.18",
    "bokeh>=3.0",
    "colorcet",
    "ujson",
    "aiohttp",
    "earthaccess>=0.17.0",
    "matplotlib>=3.10.8",
    "hvplot>=0.12.2",
    "fsspec>=2026.3.0",
    "jupyterlab>=4.5.6",
    "dask>=2026.3.0",
    "dask-labextension>=7.0.0",
    "voila>=0.5",
    "voila-material>=0.4",
    "h5py>=3.16.0",
    "pandas>=3.0.2",
    "requests>=2.32.0",
    "pyhdf>=0.11.6",
    "kerchunk>=0.2.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ujson",
]
